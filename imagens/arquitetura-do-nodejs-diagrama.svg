<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="Helvetica, Arial, sans-serif" fill="#222222">
  <rect x="0" y="0" width="1600" height="640" fill="#FFFFFF"/>

  <text x="40" y="62" font-size="32" font-weight="bold">Arquitetura do Node.js</text>

  <!-- Chavetas laterais -->
  <g stroke="#888888" stroke-width="2" fill="none">
    <path d="M 88 102 L 80 102 L 80 273 L 88 273"/>
    <path d="M 88 292 L 80 292 L 80 513 L 88 513"/>
  </g>
  <text transform="translate(64 188) rotate(-90)" text-anchor="middle" font-size="16" font-weight="bold" fill="#666666">JavaScript</text>
  <text transform="translate(64 403) rotate(-90)" text-anchor="middle" font-size="16" font-weight="bold" fill="#666666">C e C++</text>

  <!-- O teu código -->
  <rect x="100" y="100" width="900" height="80" rx="10" fill="#FFF6D6" stroke="#D4A017" stroke-width="2"/>
  <text x="120" y="148" font-size="22" font-weight="bold" fill="#7A5A00">O teu código</text>
  <g font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="middle">
    <rect x="420" y="124" width="105" height="32" rx="16" fill="#FFFFFF" stroke="#D4A017"/>
    <text x="472.5" y="145">server.js</text>
    <rect x="537" y="124" width="87" height="32" rx="16" fill="#FFFFFF" stroke="#D4A017"/>
    <text x="580.5" y="145">express</text>
    <rect x="636" y="124" width="132" height="32" rx="16" fill="#FFFFFF" stroke="#D4A017"/>
    <text x="702" y="145">node_modules</text>
  </g>

  <!-- Módulos do Node.js -->
  <rect x="100" y="195" width="900" height="80" rx="10" fill="#E3F4E1" stroke="#3C9A3C" stroke-width="2"/>
  <text x="120" y="243" font-size="22" font-weight="bold" fill="#1E5E1E">Módulos do Node.js</text>
  <g font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="middle">
    <rect x="420" y="219" width="60" height="32" rx="16" fill="#FFFFFF" stroke="#3C9A3C"/>
    <text x="450" y="240">http</text>
    <rect x="492" y="219" width="48" height="32" rx="16" fill="#FFFFFF" stroke="#3C9A3C"/>
    <text x="516" y="240">fs</text>
    <rect x="552" y="219" width="60" height="32" rx="16" fill="#FFFFFF" stroke="#3C9A3C"/>
    <text x="582" y="240">path</text>
    <rect x="624" y="219" width="78" height="32" rx="16" fill="#FFFFFF" stroke="#3C9A3C"/>
    <text x="663" y="240">events</text>
    <rect x="714" y="219" width="78" height="32" rx="16" fill="#FFFFFF" stroke="#3C9A3C"/>
    <text x="753" y="240">crypto</text>
    <rect x="804" y="219" width="78" height="32" rx="16" fill="#FFFFFF" stroke="#3C9A3C"/>
    <text x="843" y="240">timers</text>
  </g>

  <!-- Bindings -->
  <rect x="100" y="290" width="900" height="60" rx="10" fill="#EEE8F7" stroke="#7B5EA7" stroke-width="2"/>
  <text x="120" y="328" font-size="22" font-weight="bold" fill="#4B3473">Bindings em C++</text>
  <text x="420" y="327" font-size="16" fill="#555555">a ponte entre o JavaScript e o C/C++</text>

  <!-- V8 -->
  <rect x="100" y="365" width="290" height="150" rx="10" fill="#E1ECFA" stroke="#3B6FB6" stroke-width="2"/>
  <text x="120" y="407" font-size="26" font-weight="bold" fill="#1F4A85">V8</text>
  <text x="120" y="440" font-size="16">executa o JavaScript</text>

  <!-- Outras bibliotecas -->
  <rect x="405" y="365" width="300" height="150" rx="10" fill="#EEEEEE" stroke="#8A8A8A" stroke-width="2"/>
  <text x="425" y="405" font-size="20" font-weight="bold" fill="#444444">Outras bibliotecas</text>
  <g font-size="15" text-anchor="middle">
    <rect x="425" y="423" width="72" height="30" rx="15" fill="#FFFFFF" stroke="#8A8A8A"/>
    <text x="461" y="443">llhttp</text>
    <rect x="507" y="423" width="92" height="30" rx="15" fill="#FFFFFF" stroke="#8A8A8A"/>
    <text x="553" y="443">OpenSSL</text>
    <rect x="425" y="463" width="60" height="30" rx="15" fill="#FFFFFF" stroke="#8A8A8A"/>
    <text x="455" y="483">zlib</text>
    <rect x="495" y="463" width="74" height="30" rx="15" fill="#FFFFFF" stroke="#8A8A8A"/>
    <text x="532" y="483">c-ares</text>
  </g>

  <!-- libuv -->
  <rect x="720" y="365" width="280" height="150" rx="10" fill="#FDE9DA" stroke="#D9772B" stroke-width="2"/>
  <text x="740" y="407" font-size="26" font-weight="bold" fill="#8A4210">libuv</text>
  <g font-size="15" text-anchor="middle">
    <rect x="740" y="425" width="100" height="32" rx="16" fill="#FFFFFF" stroke="#D9772B"/>
    <text x="790" y="446">event loop</text>
    <rect x="852" y="425" width="108" height="32" rx="16" fill="#FFFFFF" stroke="#D9772B"/>
    <text x="906" y="446">thread pool</text>
  </g>

  <!-- Sistema operativo -->
  <rect x="100" y="530" width="900" height="80" rx="10" fill="#4A4F57" stroke="#33373D" stroke-width="2"/>
  <text x="120" y="578" font-size="22" font-weight="bold" fill="#FFFFFF">Sistema operativo</text>
  <g font-size="15" text-anchor="middle" fill="#FFFFFF">
    <rect x="420" y="554" width="90" height="32" rx="16" fill="none" stroke="#FFFFFF"/>
    <text x="465" y="575">ficheiros</text>
    <rect x="522" y="554" width="60" height="32" rx="16" fill="none" stroke="#FFFFFF"/>
    <text x="552" y="575">rede</text>
    <rect x="594" y="554" width="98" height="32" rx="16" fill="none" stroke="#FFFFFF"/>
    <text x="643" y="575">processos</text>
  </g>

  <!-- Ligação da libuv ao event loop -->
  <line x1="1002" y1="382" x2="1166" y2="352" stroke="#D9772B" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- Event loop -->
  <circle cx="1310" cy="350" r="140" fill="none" stroke="#D9772B" stroke-width="2.5"/>
  <g transform="translate(1310 350)" fill="#D9772B">
    <path d="M 89.6 -108.0 L 80.7 -123.1 L 72.5 -111.7 Z"/>
    <path d="M 130.4 51.9 L 142.0 38.8 L 128.7 34.5 Z"/>
    <path d="M -9 140 L 7 147 L 7 133 Z"/>
    <path d="M -136.0 34.7 L -137.7 52.1 L -124.4 47.8 Z"/>
    <path d="M -75.0 -118.6 L -92.1 -114.8 L -83.8 -103.5 Z"/>
  </g>
  <text x="1310" y="357" text-anchor="middle" font-size="20" font-weight="bold" fill="#8A4210">event loop</text>

  <g font-size="16" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle">
    <rect x="1250" y="188" width="120" height="44" rx="8" fill="#FDE9DA" stroke="#D9772B" stroke-width="2"/>
    <text x="1310" y="215">timers</text>
    <rect x="1383" y="285" width="120" height="44" rx="8" fill="#FDE9DA" stroke="#D9772B" stroke-width="2"/>
    <text x="1443" y="312">pending</text>
    <rect x="1332" y="441" width="120" height="44" rx="8" fill="#FDE9DA" stroke="#D9772B" stroke-width="2"/>
    <text x="1392" y="468">poll</text>
    <rect x="1168" y="441" width="120" height="44" rx="8" fill="#FDE9DA" stroke="#D9772B" stroke-width="2"/>
    <text x="1228" y="468">check</text>
    <rect x="1117" y="285" width="120" height="44" rx="8" fill="#FDE9DA" stroke="#D9772B" stroke-width="2"/>
    <text x="1177" y="312">close</text>
  </g>
</svg>
